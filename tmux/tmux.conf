# Minimal project-oriented tmux setup inspired by SylvanFranklin/.config
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g mode-keys vi

# Session management (press Ctrl+Space, release, then the letter).
bind s choose-tree -s
bind a command-prompt -p "New session name:" "new-session -s '%%'"
bind e command-prompt -I "#S" -p "Rename session:" "rename-session '%%'"
bind k confirm-before -p "Kill current session? (y/n)" kill-session

# Ctrl+Space, f: fuzzy-find a directory and create/resume its session.
bind f run-shell "tmux new-window -n projects 'bash ~/.config/scripts/project-picker.sh'"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
